# pytest.ini — Kerno test runner configuration
# Placed at the repository root.
#
# All tests live under tests/ (CLAUDE.md §4):
#   tests/unit/          fast tests with no external dependencies
#   tests/security/      tenant-isolation boundary tests
#   tests/integration/   tests requiring a live database or external service

[pytest]
testpaths =
    tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --tb=short
    --strict-markers
    -q

markers =
    unit: Fast unit tests with no external dependencies
    integration: Tests requiring a live PostgreSQL database
    runtime_identity: Live tests that run as the non-owner kerno_test_app login (C2); applied automatically to users of runtime_connection or runtime_pool
    pilot_profile: Live tests that need the runtime login to hold the pilot grant profile (PILOT-READY-003); selected only by --runtime-profile pilot, deselected otherwise
    slow: Tests that take more than 2 seconds

minversion = 7.0
